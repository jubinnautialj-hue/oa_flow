server:
  port: 5188
  servlet:
    context-path: /api

spring:
  application:
    name: oa-flow-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/oa_flow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

flowable:
  async-executor-activate: true
  database-schema-update: true
  db-history-used: true
  history-level: audit
  idm-engine:
    enabled: false
  form-engine:
    enabled: false
  dmn-engine:
    enabled: false
  content-engine:
    enabled: false

jwt:
  secret: oa-flow-secret-key-2024-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000

logging:
  level:
    org.flowable: DEBUG
    org.flowable.spring: DEBUG
    com.oa: DEBUG
