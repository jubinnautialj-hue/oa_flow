server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: oa-flow-backend
  datasource:
    url: jdbc:mysql://localhost:3306/oa_flow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

flowable:
  async-executor-activate: true
  database-schema-update: true
  idm-engine:
    enabled: false
  rest:
    app:
      name: Flowable REST API

jwt:
  secret: oa-flow-secret-key-2024-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000

logging:
  level:
    org.flowable: INFO
    com.oa: DEBUG
